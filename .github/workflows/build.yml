name: Build and verify WindowsFS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build application
        run: dotnet build src/WindowsFS.App/WindowsFS.App.csproj --configuration Release
      - name: Verify scanner behavior
        run: dotnet run --project tests/WindowsFS.Core.Tests/WindowsFS.Core.Tests.csproj --configuration Release
      - name: Verify WPF view-model behavior
        shell: pwsh
        run: |
          dotnet build tests/WindowsFS.App.Tests/WindowsFS.App.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tests/WindowsFS.App.Tests/bin/Release/net10.0-windows/WindowsFS.App.Tests.dll
          $testExitCode = $LASTEXITCODE
          Write-Output "WPF test process exit code: $testExitCode"
          if ($testExitCode -ne 0) {
            foreach ($probe in @('Image and PDF', 'never autoplay video')) {
              dotnet tests/WindowsFS.App.Tests/bin/Release/net10.0-windows/WindowsFS.App.Tests.dll --filter $probe
              Write-Output "Synthetic preview probe '$probe' exit code: $LASTEXITCODE"
            }
          }
          exit $testExitCode
      - name: Publish portable app
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Upload portable Windows application
        uses: actions/upload-artifact@v4
        with:
          name: WindowsFS-win-x64
          path: .artifacts/publish/win-x64/
          if-no-files-found: error
          retention-days: 14
